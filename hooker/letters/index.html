<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Archive</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-color: #2c2c2c;
            --accent: #5d4037;
            --ui-bg: #ffffff;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Toolbar */
        .controls {
            position: sticky;
            top: 0;
            background: var(--ui-bg);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        button, select {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        button:hover { background: #eee; }

        /* Letter Container */
        .letter-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            min-height: 80vh;
        }

        .meta-data {
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .meta-field { font-weight: bold; color: var(--accent); }

        /* Images */
        .image-gallery {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .letter-thumb {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: zoom-in;
            border: 1px solid #ddd;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .transcription {
            white-space: pre-wrap;
            margin-top: 20px;
            font-size: 18px; /* Controlled by JS */
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .controls button { flex: 1 1 40%; }
            .letter-container { margin: 10px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="controls">
    <button id="prevBtn">← Previous</button>
    <button id="nextBtn">Next →</button>
    <select id="contentsMenu">

    <button id="zoomIn">Text A+</button>
    <button id="zoomOut">Text A-</button>
    <button id="showTree">Show Tree</button>
</div>

    </div>

    <div class="transcription" id="transcriptionText">
        <em>No transcription available yet.</em>
    </div>

    <div class="image-gallery" id="imageGallery"></div>
</div>

<div class="modal" id="modalOverlay">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

let currentIndex = 0;
let currentFontSize = 18;

function renderLetter(index) {
    const letter = letters[index];
    $('#dateText').text(letter.date);
    $('#toText').text(letter.to);
    $('#fromText').text(letter.from);
    $('#transcriptionText').text(letter.transcription || "Transcription coming soon.");
    
    // Render Images
    $('#imageGallery').empty();
    letter.images.forEach(imgSrc => {
        $('#imageGallery').append(`<img src="${imgSrc}" class="letter-thumb" onclick="openZoom('${imgSrc}')">`);
    });
}

function openZoom(src) {
    $('#modalImg').attr('src', src);
    $('#modalOverlay').css('display', 'flex');
}

$(document).ready(function() {
    // Populate Contents
    letters.forEach((l, i) => {
        $('#contentsMenu').append(`<option value="${i}">${l.title}</option>`);
    });

    renderLetter(currentIndex);

    // Navigation
    $('#nextBtn').click(() => {
        if(currentIndex < letters.length - 1) {
            currentIndex++;
            renderLetter(currentIndex);
        }
    });

    $('#prevBtn').click(() => {
        if(currentIndex > 0) {
            currentIndex--;
            renderLetter(currentIndex);
        }
    });

    $('#contentsMenu').change(function() {
        currentIndex = parseInt($(this).val());
        renderLetter(currentIndex);
    });

    // Font Controls
    $('#zoomIn').click(() => {
        currentFontSize += 2;
        $('#transcriptionText').css('font-size', currentFontSize + 'px');
    });

    $('#zoomOut').click(() => {
        if(currentFontSize > 12) {
            currentFontSize -= 2;
            $('#transcriptionText').css('font-size', currentFontSize + 'px');
        }
    });

    // Modal Control
    $('.close-modal, #modalOverlay').click(() => {
        $('#modalOverlay').hide();
    });

    // Tree Image (Placeholder)
    $('#showTree').click(() => {
        openZoom('tree.jpg');
    });
});
