        transcription: "My dear Mary\n\nFanny was taken very unwell yesterday almost immediately after Dinner with violent pain in the Stomach and soon became rather hysterical and went to bed in a very feverish state with nettle-rash — she took some Pills and I am glad to say is this morning nearly as well as usual except being weak. She intended writing to you but as I think she is not very able to do so I have undertaken to write for her and myself at the same time. Rosa does not recover so fast as we could wish though she is somewhat better she sat up yesterday for the first time and today she is come down into your room where she will sleep tonight — she is still troubled with pain in the left side shortness of breath occasionally and cough, but she has a good appetite — talks loud and strong and we are in hope she will gradually recover — As to Stephen the sale went off well but he is left in an empty house or nearly so, with other debts hanging over him, what he will do I cannot imagine. Little Albert grows and improves and is a nice little boy, I have just been out in the Greenhouse with him getting some grapes and figs — I should very much like to have the book you were kind enough to offer to get for me namely Brewsters work — as I heard much of it but never seen it — Mrs Davies and her little Family spent an afternoon and even they seemed to enjoy themselves, we sent them home in the Carriage. Mrs Dickenson and Mrs Davies have called here since in Mrs Dickenson's pony chaise. Mrs D. left I think on Tuesday last. We hear that Mrs Stephen Marchant and her baby (a little boy) are both doing well and Stephen seems I hear supremely happy — Charles Pichon came Tuesday he brought your little Book which shall be sent by Post tomorrow. All here join in love and kind regards to you and believe me to remain your very affectionate Father\n\nStephen Hooker",
        images: ["18.jpg"]
    },
    {
        title: "A stormy night and final farewells",
        date: "",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy)",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "P.S. Love to dear John\n\nMy dear dear Julia\n\nI was very much pleased to receive last night after our letters were posted a good kind letter from you. Many thanks for it dear Julia. It is indeed trying to be in England and yet not able to be with you all this last week but I am very glad we did come here instead of going from London as they must have had very bad weather. Dear Frank went down this morning to see whether she was in. I could not as I felt sure she was for before we went to bed Frank asked and every one said she would be in before morning but the wind has changed again and they say the wind is driving the ship quite out of the harbor. The sea looked very rough today and it is very cold here. It is raining fast. We went out last night and got all the little things we wanted. We got to tins of biscuits 2 lbs each and 2 pots of jam some arrowroot and Keatings Insect Powder and my little mug. How do you get on dear Julia I hope you are better than when we left. Oh Julia dear how I long to kiss you all. Thank dear Mamma and Clara for thinking of coming although I would give worlds to see them yet I think it perhaps better as it is. I do not think I could part with you all again. I feel that everything is ordered in love and yet I cannot help grieving. I will do all I can dear Julia for little Alby. He shall be my pet as he was yours and now dear Julia I must say good bye I shall write very often. With fond love to all and I remain ever your loving sister\n\nCharlotte Young\n\nThe Post is just going. Do write. We have had no letter but perhaps we shall tonight.",
        images: ["19.jpg"]
    },
    {
        title: "Life in Auckland and plans for the Bay of Islands",
        date: "1860, Janaury",
        from: "Frances Louisa Hooker b.1842 in Wakefield Cottage, Auckland, NZ",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My dear Aunt Julia,\n\nI was very much pleased at receiving your very kind letter for I had been longing to hear from home, and wondering why some of you did not write by this last mail. I received your letter which by the date of it I find it ought to have come by the mail before. But I suppose you sent it too late therefore was obliged to wait for the next mail. I was very much surprised and sorry to hear of dear little Fritz Moncton's death, poor little thing. I am sure his mamma and papa must have felt it very much. We have not yet gone on our land but we intend doing so soon. It is near a place called the Bay of Islands, it was once the capital of New Zealand and was a very beautiful place before Auckland was found out but several [years] ago it was burnt down by the Natives. A great many rich families are going up there to settle, who will in a few years make a beautiful place of it again. All sorts of fruit grow there still, such as peaches, oranges, lemons, figs, grapes, Etc. There is a very rich family going to settle close to us so we shall not be quite alone. I am very fond of the country, much more so than the town, but it is the idea of going up there before the land is cleared, and without having some sort of a hut or home to go in. Those gentlemen who have plenty of money will leave their wives and children at home, at least in Auckland, until they cleared a part of the land and built them a hut to live in whilst they are clearing the other part of their land and built them a house, but I am sorry to say that we shall not be able to do that. I suppose by this time you are once more settled at The Firs, for a short time. How very very much I wish that I was with you. I would give anything to return to England again. I don't like living with Papa and Mama and the children at [unclear] I am treated like a dog by them all [I] try and get a situation as governess but I hear from a great many people that governesses here are treated more like servants than anything else. As well as teaching they make you work about the house, and I am sure I should not like to do that, and besides if that was not the case, Auckland is crowded with schools and young ladies without number are seeking situations as governesses, but there are none to be found, therefore there is a very poor chance of my getting a situation. Will you give my love to Grandmamma and thank her very much for the things she sent me, and I am very much obliged to you for the paper you sent me. I think them all exceedingly pretty. I was in very great want of a dress as I have nearly outgrown everyone that I have, a great many of them I can't wear again. Neither the shirts nor the bodies(?) You would be surprised to see how very much I have grown since I left England. I need not tell you how very much pleased I was to see Aunt Charlotte. She is, I am glad to say, very well, and much fatter than when I last saw her. They have also taken their lands near us, but I am sorry to say they will not live there. How is Madame Pichon and the rest of the family. Have you heard or seen any of them lately, tell me how they are and whether they are still living in France. I should so like to see them all again, and also all the young ladies that were there at school, and I hope I shall some day. Albert sends his love to you and grandmamma and uncle John. He often looks at your portrait and wishes very much that he could see you all again, I wish so too. I must now wish you good-by, dear aunty Julia, with much love to dear Grandmamma aunt Clara and yourself and uncle John.\n\nI remain you affectionate niece\nFrances Hooker\n\nP.S. How is aunt Rosa. I hope she is better. I suppose she is now at Hastings When you write will you give my love to her. The children wish me to thank you all for the presents you sent them, they are very much pleased with them.",
        images: ["20.1.jpg","20.2.jpg"]
    },
    {
        title: "Greetings from Auckland and family updates",
        date: "1860, Janaury 26",
        from: "Frances Louisa Hooker b.1842 in Wakefield Cottage, Auckland, NZ",
        to: "Rosa Hooker b.1822",
        transcription: "My dear Aunt Rosa,\n\nI know you will be pleased to hear from me. We all hope you are a great deal better. I hope dear Grandmamma and all my Aunts and little Ellen Whittle are quite well. I wish I could see you all again. Aunt Charlotte and Mr. Young have ... arrived safely ... we are very much pleased to see them. Papa has taken his land at the Bay of Islands and Mr. Young has taken his land near us but I am sory to say they will not live their they are going to live at Palumahoe which is 90 miles from us and I am afraid we shall not have the pleasure of seeing them very often. Everything is very dear here but Peaches and Grapes they are very cheap you can get a great many for a shilling we we are all very well in coming over mamama and Papa and Mamma came on shore and got a house for us directly we arrived in Auckland our next town I am sory to say will be in the bush I am very much obliged to you for the present you sent me and also to Aunt Clara for the present she sent me we are all quite well and send our love to you all they are all much obliged to you all four the beautiful presents them you must excuse my wighting I for I was very ti——— I must now s-ay good by dear Aunt Rosa.\n\nFrom your affectonate\nNeice Ellen Hooker\n\nEDITOR NOTE: There is something peculiar about this letter which is signed Ellen, but the beginning of the letter is so obviously from Frances. The address and handwriting is exactly the same as the one to ‘Aunt Julia’ dated January 1859 but after about six lines the writing gets worse and the spelling becomes poor and unlike Frances although the use of words and the order of them as for instance: “.. are very much pleased..” are hers. It is almost as if she had had too much to drink, leaving out letters and repeating words. She had sent her love to little Ellen, which may have induced her to sign as Ellen, or she may have got Ellen, her sister to finish the letter for her, and she signed as if she had written the letter. We shall never know, but I believe this letter is written by Frances.",
        images: ["21.jpg"]
    },
    {
        title: "Life in New Zealand and a parting from the Plimptons",
        date: "1860, February 26",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy) in Patumāhoe, New Zealand",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My own dear Ju\n\nMany thanks for your dear letters. You cannot tell how precious every word is to me out here you know how anxious I used to look for the Mail. I am just the same now but your letters enclosed with Mamma's & Clara's ought to have come last month as I have another one from dear Clara dated a month after. The Mail always goes on the 12th so if you do not post your letters untill the 15th they lay at the Post Office untill the next Month. I was so glad to hear of your happiness dear Julia. You do indeed deserve a good Husband and I do trust and believe he will make you one. A good husband is indeed a blessing. Dear Frank and I live so happyly together. He is so unselffish I know you will be sorry to hear we have parted from the Plimptons but you must not be, for we are glad we are only sorry that we ever went and took our things up but we unpacked nothing. We got them returned to a Mr Passons as we were told they would not be safe as Mr Plimpton owes money. The country up there is beautiful. It really is a lovely Bush farm but the people and the inside of the house are not so lovely but I have told dear Mary all the particulars. Dear little Alby seemed very pleased at the thought of going in the Ship again. He seemed a better Boy than any of them. How I wanted them to let him stay with us but they would not. Stephen said he would soon be useful. Then I asked if Frances might stay but no Louisa said she was the cause of there coming and she should go with them and rough it and besides she was to teach the children and they would not let me have one of the others. They have taken a large Dog and a little pupy also a Goat. The children are much pleased with them. I am glad dear John is getting on well with the house. Give my best love to him & kind regards to Mr & Mrs Wheeler? John’s partner, I am afraid there is no chance of seeing them out here now. Its of no use anyone coming out unless they have a little money to start with. If you ever see Miss Coshton? to give my very kind love to her and say I found her case so useful. I do not know what I should have done without it. I left my letters open to quite the last thinking I might be able to tell you what we were going to do but I can tell you nothing certain but what we hope to do is to get one acre of land to build a house on up at Patumahee? and for dear Frank to go out to work at fencing. He would if we can get the land go up and get the house readdy while I stay with Mrs Balby? I am afraid you will think this a funny letter but I promise you a better when I get my own little house. We hope to hear from dear Stephen soon. Frank got his letters sent on to him, dear Alby seems a pet with his Mother and now my own dear Ju goodbye\n\nWith every wish for your happiness I remain your loving sister\nChardy\n\nP.S. Thank dear Clardy for her kind letter I will answer it next Mail and write to dear Mamma to. I am very well and in want of nothing as yet which I am thankful for. Frances is going to write and tell me if she is very unhappy & if she is we shall manage to get her with us. Our kind love to Mr Suter. Frank sends his love to all.\nMrs Balby? is just come for us so goodbye. Do write often.",
        images: ["22.jpg"]
    },
    {
        title: "Life in the bush and the threat of the native’s war",
        date: "1860, August 23",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy) in Patumāhoe, New Zealand",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My dear Old Ju\n\nThe Mail is just come in which brought me a nice long letter from dear Mary. Will you give my best love to her & thank her for it. I will write to her next mail if all is well. I cannot help thinking there ought to be another letter for me as dear Cardy said she would write me a longer letter next mail but perhaps I may have one by the next post but I shall not be able to tell you as I must send this before that comes in. I do trust you are all well. I think Mary would have said if you were not. I am glad to hear that Mamma is with you. How happy you must be. So John has sold the poor Old Firs but I suppose it was best. I do hope now that our money affairs will be settled and if we have any more money to come Mr Hinds will send it as soon as possible as we shall not want it more than we do now as Mr Otto has written once or twice for his money and then we all fear we shall have to leave here on account of the Native’s War and I do not know how we should move without a little money. Dear Frank earns quite enough to keep us but we have had a few old debts to pay off. If we had not let the Plimptons get so in our debt we should have done pretty well. They did owe us 19 pounds but as we took things of them they only owe us 7£ but I do not expect ever to get it. We should do very well now if the natives would but leave us alone and if we could but pay Mr Otto his ten pounds then we could stay here untill we got money enough to move up were Shepherd is if we thought beest to do so. We are very much perplexed to know what to do for the best. If we could bee content to stay in New Zealand all our lives I think perhaps it would be as well to stay here but I want to be getting money so that we may spend a few happy years in dear England with you all. If we had the money I think we should move to or near Auckland as we cannot tell at what time we may have to go and then most likely we should have to leave all our things we could leave better than any of the settlers as we have no land or cattle to care about. The Crisps say they shall prepare just as if they had to go. They have taken some Boxes to town and are going down with some things this week and say they will take a Box down for us so we have written to Mr Thorn to see if they can take care of it for us. We hope to hear on Wednesday. The Crisps and Vickers have been most kind to us. Mrs Vickers was a Miss Crisp. I have just been reading over your dear letter which I received the Mail before this last and I feel my own dear Ju that you do indeed deserve a nice long letter in return but my mind seems too restless to write much. I do indeed thank God that He has given you also a good kind Husband. You must tell me dear Ju if you are going to have a dear little one. I can scarcely believe I am going to but so it is. I hope dear Ju it will not be much trouble to all of you to get me the little things I asked about in my last letter. Oh my dear Ju how I wish I could be near you all. You cannot tell how I long for home when I am ill. I should not care so much if dear Frank could be with me always but I cannot wish that as we should not get on much if he did not work. I have got a little Girl now to stay with me but she is a good big Girl and a farmer’s daughter up here so we cannot say much before her and she is very particular in what she eats — likes Bread and butter which are the two most expensive things we have to bye but I am very glad to have her so we must put up with a little. We heard from Stephen & Louisa a little while ago. Louisa says she dislikes New Zealand more & more the longer she is here. I cannot see much in it, then we have come at a very unfortunate time. I believe we would all be glad if we had never come but I am not sure about Stephen. So dear Ju if you ever hear of anything to suit Frank you can let us know as we should not regret very much leaving here but we will hope for the best. I am very glad dear Mamma is with you. I feel she will be happy with you and your dear Henry. Do you think dear Cardy is comfortable. Do think and persuade her for the best. Are you and dear John right again. Give my love to him. We have not yet heard from him but I suppose he is as busy as ever. Frank has written to him several times. Frank had a kind letter from Mr Thorn saying he can take care of a box for us. We received no other English letter by this mail, and now goodbye dear Ju, With best love to dear Mamma, yourself and kind Husband\n\nBelieve me dear Ju your ever faithful sister\nChardy\n\nP.S. Frank has written to dear Mamma and Mary but posted them to Brenchley then we thought you would be sure to get some news of us.\nI have sent you dear Ju two or three mosses.",
        images: ["23.1.jpg","23.2.jpg"]
    },
    {
        title: "Chardy to Julia awaiting arrival of baby",
        date: "1860, December 24",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy) in Onehunga, Auckland, NZ",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My dearest Ju,\n\nI am quite ashamed for not writing to you oftener but you must flatter yourself with the thought that I feel you are such a dear good Girl you will always find some excuse for me. Your last letter was a dear long one and I do indeed thank you very much for it. Oh how I long to be with you all again but we do not know what to do for the best. I have lately felt I must come home to you all but people tell me that low spirits are quite usual at times like mine. We are at Onehunga still waiting for the war to end and the arrival of our little one which I think cannot be long now. How thankful I shall be when it is over. I am so glad to have Mr Purchas to attend me. I feel he is really a good kind man and his Wife is just the same. They have asked me to go there when ever I like & Mr P. said I ought only to make this Cottage a sleeping place but of course that would not do. Still I have been pretty often for I do not like being alone and I do not feel it right to keep dear Frank at home when he is able to get work. Mr P. asked Frank the other night how he was off for money. He said he had not much himself but what little he had he was quite readdy to share with us. Was not this kind but Frank did not accept it as he felt they were doing quite enough without that for we have milk, butter & potatoes from there besides other little things at times. I think when I wrote home last I said I was expecting Frances every day. Well a few days after I had a letter from her saying she was afraid to come on account of the natives and seemed to think even Auckland was not safe but she did not know we had moved down here when she wrote so I do not wonder so much at her not coming but Mr Vikers saw Mr A Shepherd a little while ago and he said he did not think she would come at all. She asked me to write again and tell her about the natives. I have done so but I did not say much about her coming so she will do as she likes about it, but dear Ju I could not help having a good cry about it just at first for I felt so sure of her coming and although she is young she seems as one of us and I should not mind what I asked her to do so much and of course I must have a nurse for a week, I forget what they charged at home but out here most of them charge £ a week and you cannot get anything of a one under one pound ten. I am going to have a Mrs Moor. Mrs Purchas recommended her. She nursed her and they liked her very much. Now dear Ju you must promise not to let your Husband see my letters as I am quite sure he would be very much shocked at them but I do not seem to mind what I say to you. I very much wonder which of us will be a Mother first. I think I ought to be as I was married first but I do believe it will be about the same time. I am afraid I almost envy you having dear Mamma and sisters to be with you besides having a Doctor for your Husband but you cannot have a more kind and loving one than I have. We do live most happily together but we both feel a longing for home. Since writing this Mrs Vikers has come to stay with me and she says she or her Mamma will stay with me until my confinement. I know she would rather her Mamma come as I think she feels rather nervous about it but I do not like bringing Mrs Crisp down all this way. I think I shall wait a little while and see if Frances comes. The English Mail was due yesterday so we hope to have letters soon. Today is Sunday before Christmas day. We went to Church this morning. It seems such a treat after being in the Bush having no Church. Mrs Purchas has asked us to spend Christmas day with them. Mrs P. hurt her knee 20 years ago and it is just come bad again now so that she cannot walk at all just now. Since writing this the English Mail has come in and brought us news of you all. I am very sorry to hear Mr Suter has not been well but I hope he is well again before this. Remember me very kindly to him. I received dear Mamma's, Mary's and Clara's letters quite safely. Also the 20 pounds which we do thank dear John very much for forwarding to us and also dear Cardy for the trouble she took. I do hope you wont any of you think me unreasonable in asking for it to be sent but I felt we must be at a little more expense just at this time and poor Frank has quite enough to get us a bear living. Yet we are very happy, love seems the thing we have most of and that makes us happier than anything else could. Without it every thing would appear very different. It did not matter about the little things coming out by this mail as Mrs Purchas has kindly lent me hers until I receive mine which I expect will be only a fortnight after I want them but the time is indeed drawing near. Oh how I wish I could have some of you with me but I try and think all will go well and that God will in his mercy grant me health & strength again. I did hope to write to all this time but I find I cannot. I did begin letters to dear Mary & Clara but feel they are not worth sending but I shall hope to answer their kind letters very soon and also dear Mamma's. Frank is writing to her. I send my very fond love to all and now dear Ju with much love to your self in which dear Frank joins\n\nBelieve me as ever your affectionate sister\nCharlotte Young\n\nP.S. Thank you dear Ju for the Anthems. Best love to dear little Nelly when you see her & all kind friends. Yesterday was New Year's day and I do indeed wish you all a very happy new year. It does not seem like Christmas the weather is dreadfully hot but there is generally a little breeze or I do not know how we should bear it but we are both wonderfully well I am thankful to say again, goodbye.",

    {
        title: "A bare living on peaches and potatoes",
        date: "1861, March 26",
        from: "Stephen Hooker b.1817 in Auckland, New Zealand",
        to: "Julia (Hooker) Suter b.1824 in London, England",
        transcription: "My dear Julia\n\nI have received several very kind letters from you which I ought to have answered long since but I have been so taken up with one thing and another that I have not had time to do so — I am glad to hear that you are so comfortable with your Husband & trust you may have many years to enjoy his society but you must excuse my congratulating on your marriage for that I can never do to any one as I have been so dreadfully bitter myself that I would advise everyone to remain single & not risk the chance of getting a fiend in human shape. I understand by this time you expect a little Suter. I hope it has arrived and that you are both doing well. Albert sends his love to you he has grown very much and is a very strong boy not the delicate little child requiring Aunt Julia to run after him to tie a handkerchief round his neck but runs without shoes or stockings. He brought up yesterday 20 pounds of Peaches a distance of 1 1/2 miles of very hilly ground. He received the enclosed letter from the Postmaster Gen. St. Martin's le Grand. I conclude it must be the Packet of Cards you spoke of sending but which have not arrived. In your last you said Mary was not well I hope she is now better give my love to her & say I will if I get the cash to pay Postage send her a letter by the next Post. As regards ourselves we are here in a miserable state almost starved, we are now living upon Potatoes & Peaches & sometimes Green Peaches alone which is the case to-day. I have cut down 5 acres of Wood Land & am now planting a few Potatoes. We hear but very little about the War the natives here tell us it will soon be over that they do not intend to fight. You will no doubt hear all particulars from Charlotte, they are near Auckland & Hereford know all that is going on. When will the affairs be settled & what can be the delay pray do write and tell me all about it. You said in one of your letters that Mr Oakden told you that all would be settled at Michaelmas or very soon after, but that time is long since passed. Give my love to my Mother. I do hope and trust that you one and all will be very kind to remember her present living is very different to what she has been used to. I cannot forgive myself for leaving England after promising not to leave her, but I fear that I could never have been of any use to her as Louisa & she could never agree but as it is perhaps things may turn out that we may enjoy each others society. Remember me kindly to Mr Suter & Believe me Yr affect. Brother\nStephen Hooker\n\nEnquire at the General Post Office when you go for the Letter the Particulars of Postage to N.Z. I Believe letters directed to be sent via Southampton are charged six pence by Marseilles 9d but if not directed by any particular way are sent by the first mail going and if that is by Marseilles an extra nine pence is charged for Postage & fine. We shall be very glad to receive some Newspapers which I believe should be directed to be sent Via Southampton & if a stamped Newspaper a penny stamp is required but if not a stamped Paper then a twopenny stamp — put your initials on the Paper that I may know from whom it comes & when you have found out let John know.",
        images: ["25.jpg"]
    },
    {
        title: "Frances to Aunt Julia on loss and life",
        date: "1861, August",
        from: "Frances Louisa Hooker b.1842 in Onehunga, Auckland, NZ",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My dearest Aunt Julia\n\nI am extremely sorry to hear that you suffered so very much during your confinement and also of the loss of your darling child, it must indeed be very sad after having suffered so much for it. I sincerely hope dear Aunt Julia that you are getting on nicely and that your former health has been restored to you again. I long to hear from you again dear Aunt Julia it seems such an immense long time since I last heard from you. How often my thoughts are directed to you all at home and my desire to see you all again is very great, I cannot but think that I shall come home some day, if I was to think otherwise I do not know what I should do. We have several very nice kind friends here although they are rich and we are poor (at least rather so compared to them) yet they are as kind as they can be to us, it is through their having known Mr Young when he was out here before I think. The other day I asked one of them a Mrs Mayland if she would mind letting me do some needlework for her (she said something about having some work before that she must put out) and when I asked her she said she would be most happy to give it to me to do, and that what she said before was a hint, that she had some to be done if I did not mind doing it, she has a great deal to be done so I hope I shall be able to earn enough in that way to buy me some Summer Clothes, as I have hardly any, things are so dreadfully dear out here dear Grandmama sent me two £ last Mail & things being so dear I was not able to buy many & those are for the Winter but I dairsay I shall be able to earn enough to buy some Summer Clothes. We have at least Aunt Charlotte and I have been spending a few days with the Purchase's again while Mr Young was reshingling the house we are living in. I do thoroughly enjoy myself when I go down there they are such dear kind people. I dont know whether I told you when I wrote to you before that Mamma pets Albert very much and is very kind to him, I know you will be glad to hear that Auckland has been very gay this winter, there has been several balls given and concerts also and there has also been a great many weddings, we are living about seven miles from Auckland so we do not see any of it. I suppose London has been very gay also. I dont seem to have any news to tell you dear Aunt Julia we see and hear so little and Aunt Charlotte will tell you about the war I have no doubt. If dear Aunt Clara or Grandmama is with you when you receive this letter will you give my fond love to them and also to your dear self with kind remembrances to Mr Suter\n\nI remain\nYour most affectionate Niece\nFrances Louisa Hooker\n\nWrite me a long letter dear Ju if you are quite well.",

    {
        title: "Chardy with condolences after stillborn",
        date: "1861, August 5",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy) in Onehunga, Auckland, NZ",
        to: "Julia (Hooker) Suter b.1824",
        transcription: "My very dear Ju\n\nI was so grieved to hear of your sad disappointment I can indeed fully enter into all your suffering and sorrow. None but a Mother can feel what it is to lose her first born and after such suffering. I did believe & trust that you would have been blessed with a dear child. I felt you really deserved one. We must indeed be thankful notwithstanding all our sorrow for being spared to live longer with our dear husbands. Mamma tells me you are going into Yorkshire. Is it to remain or only on a visit. I hope by this time you are getting quite strong again. I am thankful to say I am but I am a very bad walker still a quarter of a mile is quite far enough for me. You were very good dear Ju to write me a few lines. I hope it did not tire you much. We are going on much in the same way as when we wrote last rather poor but very happy. Dear Frank spoils me a little I am afraid & I do try to spoil him. We often laugh and wonder what dear John would say to us for we call one another such funy pet names. The Purchas's are just as kind as ever. We have been staying there for a few days while Frank was shingling our house. Mrs Purchas is expecting to be confined in about a month's time. I believe she seems to think more about it this time as her left leg is quite stiff and she cannot move about much. We are very much in hopes we shall have peace now as there is a new governor appointed here at last. The old one that was here some time ago and all natives liked him very much and every one thinks he will be able to make them give in. I do hope he may. It is Sir George Gray that is coming. This good news about peace makes us in rather better Spirits. I do not know what I should have done if dear Frank had been called out. I think now if we wait a little while Frank will in the end get some good appointment for we have some very good kind friends who say they will do all they can. I should indeed like to come back to dear England directly but if we can do any appointment in the meanwhile we could soon save money enough to retire to England with. I am so glad dear Mamma continues well give my love to her and thank her for her letter which I was so pleased to receive. Frank is writing to Mamma this time. Will you also give my love to dear Mary & Clara & thank them for their letters. I am afraid I shall not be able to answer them this time. You must not any of you think I love or think of you a bit less because I do not write quite so many letters at a time but I have not so much quiet time by myself as I used to have in the Bush and I think you will remember my weakness for getting alone to write letters. Frances is with us still. When she first came she seemed very glad to be here but lately she has got very independent and discontented always saying she wants this or that. I have given her a good many of my things but it is of very little use her having anything for it is put on every day and if we say anything to her about it she gets cross. She is a girl that wears things out in no time and we realy cannot afford to give her any new just at present so I have advised her to get some needlework to do for she has plenty of time and the friends that we have I know would not think any the worse of us for it. She is going to do so, do not take any notice of what I have said about Frances when you write as she always reads our letters. And now dear Ju I must conclude with very best love to your self and all kind remembrances to Mr Suter.\n\nBelieve me dear Julia\nYour very affectionate sister,\nCharlotte Young\n\nP.S. Will you give my love to dear John and thank him for writing to Mr Purchas.\nMy love to all dear friends.",

    {
        title: "Frank joins the Otago gold rush",
        date: "1861, September 20",
        from: "Charlotte (Hooker) Young b.1830 (aka. Chardy) in Onehunga, Auckland, NZ",
        to: "Mary Hooker b.1812 (aka. Cardy)",
        transcription: "My very dear Cardy\n\nFrank is really gone to Dunedin but I am not sure if he will go on to the diggings it will depend on what he hears when he arrives there. He started on Monday it is about a ten days passage to Dunedin. The diggings are about 60 miles from there and a dreadful road. Some say you ought not to go without a guide. I made Frank promise not to go if there was the least danger. Do you not wonder at my letting him go at all. I am sure I do not know what I was thinking of he has promised not to be away longer than three months but this seems an age now. Frances and I live on in the same Cottage I could not have staid here but for being so near the Purchas's but I know if I felt the least nervous I could go there. I am thankful to say I feel pretty well at present. We have got two of Mr Tidy's? children who came out with us for Frances to teach. They pay 3s a week for both. Frances has the half for anything she likes and we have the other. I was so in hopes they would have come in the house while Frank was away as they would have been company for us at night but they prefer not. We have had a little Boy to sleep here some times but last night he cryed to go home so I suppose he will not come again. The ——— I think I told you was coming but just the last day he said he was going away very soon so we are left without anyone but I do not mind much as we have people in the next house and we can hear them talk quite plain. Still I cannot say I like being left alone. I always wake up in the night and then I cannot go to sleep again for so long.\n\nOct. 7th  Since writing this I have heard from dear Frank but he had only got as far as Napier He was not ill of course and had heard very good news from the diggings. He went down in the same ship as Mr Giles the Doctor at the Manukau and his brother a Mr Drake. Frank says they are very good friends to him. I am so thankful he had 5£ when he started and we had 2 £10 but then we have stores that will last us some time. I am doing some work for Mrs Whalland? a friend of ours some little dresses for her Children and I am going to do some for Mrs Brookfield She is such a nice woman. Miss Priters? from the Bush is governess there. We cannot think what has become of the English Mail. The Sydney steamer came up here at the right time but the Mail had not arrived there. I hope she is gone back again for it and was expected in on Saturday at the latest but has not yet come and I hear the Mail for England closes tomorrow as when it does come it will start back again directly so I am afraid we shall not be able to say if we get our letters safely. I am afraid dear Cardy will think my letters are all very selffish always about our affairs but I can assure you my dear Cardy although I do not ask you much about home things it is the greatest pleasure I have hearing from you all about what you are doing and how you are geting on and above all if you are all quite well. Do always tell me this dear Cardy. Oh may God grant we may all meet again even in this world. I hope dear Julia has quite recovered. I am so glad that she and John are all right again. When is John going to be married. I quite believe he never will now. Well so much the better for now you can all make it a home but then it might be different. We may have a home in dear England yet it is the thought of this that made dear Frank & I determined to try and bear the parting. You see I have not quite done with hope & faith yet Cardy but I think it almost time I had. At any rate in worldly matters. We had a beautiful sermon upon the words All things are possible to them that believe last Sunday morning. But now dearest Cardy I must say good bye as I want to write to dear Mamma & Frank also by this mail (God help you all) & with much love to you my dear Sister, I remain your very affectionate sister\n\nCharlotte Young\n\nFrances sends her love.\nWill you give my love to all and dear Nelly.",
        images: ["28.jpg"]

        to: "Julia (Hooker) Suter b.1824",
        transcription: "My very dear Aunt Julia\n\nI am sorry to say that we have not yet received letters from home, at least this month's letters, therefore we shall be obliged to post our letters before we receive yours, as the mail closes tomorrow, I hope we shall hear that you are getting on well, I dairsay you heard by our letters by the last mail of Mr Young's going to the gold diggings, he has been gone about three weeks today and intends returning at Christmas, so you see Aunt Charlotte and myself are left alone for a little while, I have two pupils who come in the morning at nine and stay until four, so we are not quite alone all day. There is a gentleman who wishes to place his child in some family where she might be well taken care of and Mr Brookfield a gentleman whom I dairsay Aunt Charlotte has spoken to you about advised him to send her to us, he wished her to be taught music as well as other school duties, Mr Purchase also spoke to him about it and told him that we had not a piano, but that was a difficulty that might be easily overcome as a hint that he could hire one and send it down to us, as Mr Purchase says that he is very rich & could well afford it but whether he will or not I cant say. I am very much in hopes that he will. Aunt Charlotte has at last had all her things sent down from the Bush so we are beginning to look more comfortable than we were before, Mr Young has made two pretty little side boards each side of the mantlepiece in the sitting room and the doors are made of blue pleated lining they look very pretty indeed, I think Aunt Charlotte has a very handy Husband as well as affectionate and kind, they have also bought a nice little American stove I hope dear Aunt Julia you will be soon well enough to write to me again, it is such a long time since I last heard from you, have you left London yet, I suppose Moatlands is looking quite charming. I am afraid you will think this a very short letter which it is but I really have no news whatever to tell you therefore dear Aunt Julia I must conclude\n\nWith much love to yourself and kind remembrances to Mr Suter\nI remain\nYour ever & most affectionate niece\nFrances Hooker\n\nDid you not say that Mary Jane Harwar comes to see you sometimes, will you give my kind love to her when you see her again and also to her sisters, goodbye dear Aunt Julia.\nAunt Charlotte sends her love to you, & kind remembrances to Mr Suter.",

let currentIndex = 0;
let currentFontSize = 16;

function renderLetter(index) {
    const letter = letters[index];
    $('#dateText').text(letter.date);
    $('#toText').text(letter.to);
    $('#fromText').text(letter.from);
    $('#transcriptionText').text(letter.transcription || "Transcription coming soon.");
    
    // Render Images
    $('#imageGallery').empty();
    letter.images.forEach(imgSrc => {
        $('#imageGallery').append(`<img src="${imgSrc}" class="letter-thumb" onclick="openZoom('${imgSrc}')">`);
    });
}

function openZoom(src) {
    $('#modalImg').attr('src', src);
    $('#modalOverlay').css('display', 'flex');
}

$(document).ready(function() {
    // Populate Contents
    letters.forEach((l, i) => {
        $('#contentsMenu').append(`<option value="${i}">${l.title}</option>`);
    });

    renderLetter(currentIndex);

    // Navigation
    $('#nextBtn').click(() => {
        if(currentIndex < letters.length - 1) {
            currentIndex++;
            renderLetter(currentIndex);
        }
    });

    $('#prevBtn').click(() => {
        if(currentIndex > 0) {
            currentIndex--;
            renderLetter(currentIndex);
        }
    });

    $('#contentsMenu').change(function() {
        currentIndex = parseInt($(this).val());
        renderLetter(currentIndex);
    });

    // Font Controls
    $('#zoomIn').click(() => {
        currentFontSize += 2;
        $('#transcriptionText').css('font-size', currentFontSize + 'px');
    });

    $('#zoomOut').click(() => {
        if(currentFontSize > 12) {
            currentFontSize -= 2;
            $('#transcriptionText').css('font-size', currentFontSize + 'px');
        }
    });

    // Modal Control
    $('.close-modal, #modalOverlay').click(() => {
        $('#modalOverlay').hide();
    });

    // Tree Image (Placeholder)
    $('#showTree').click(() => {
        openZoom('tree.JPG');
    });
});
</script>
