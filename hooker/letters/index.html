    <style>
        :root {

            --text-color: #2c2c2c;
            --accent: #5d4037;
            --ui-bg: #ffffff;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Toolbar */
        .controls {
            position: sticky;
            top: 0;
            background: var(--ui-bg);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        button, select {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        button:hover { background: #eee; }

        /* Letter Container */
        .letter-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            min-height: 80vh;
        }

        .meta-data {
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .meta-field { font-weight: bold; color: var(--accent); }

        /* Images */
        .image-gallery {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .letter-thumb {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: zoom-in;
            border: 1px solid #ddd;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .transcription {
            white-space: pre-wrap;
            margin-top: 20px;
            font-size: 16px; /* Controlled by JS */
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .controls button { flex: 1 1 40%; }
            .letter-container { margin: 10px; padding: 15px; }
        }

const letters = [
    {
        title: "Business in York and longing for home",
        date: "1828, July 19",
        from: "Stephen Hooker b.1779 in York, England",
        to: "Frances (Gorringe) Hooker b.1789 in Brenchley, Kent, England",
        transcription: "My dear Frances,\n\nI arrived here last evening about 6 o’clock & I was so little tired with the journey that I should very gladly have returned immediately had I not been obliged to stay for the Business I came upon. We had a very pleasant Party in the Mail who consisted of Colonel Wilson who is M.P. for the City of York, and a young Officer who was taking his sister Home from a London School. The young lady was so like Emma (though a year I should suppose older) that I assure you I never saw a greater likeness between two people in my life. The two latter went on in the Mail to Edinburgh. I walked round the Cathedral and the Castle after I had dined and took my tea about half past nine and soon after went to bed. I should have written to you last night but I found that the letter would not reach you till Tuesday Morning which it will do now. I did not rise very early as you may suppose (about half past ten) and after breakfast I called upon the Solicitor who informed me that he expected the business would be settled on Tuesday, you will therefore probably see me about Friday or Saturday. I wish very much I could have you all here to show you the Cathedral or Minster as it is called, it is certainly the main object worth seeing in this City. I am tired of being alone already and shall be very glad to be again amongst those who I love and who love me and shall lose no time in getting Home, but I have some idea of dividing the distance to avoid the chance of fatigue though I assure you I felt quite as comfortable and as little tired when I arrived at York as I was when I got into the Mail in London. If I can get Home sooner than I mentioned above depend upon it I shall. The Judge has just made his Grand entrance into the City but the Bustle and noise gives me very little pleasure, all the fine show and parade is quite thrown away upon me. If you should have anything to write to me about before I reach Home direct to me at the 4 Swans, Bishop Gate Street, where I shall call at all events write to me there and I shall enjoy my journey Home when I know you are all well and comfortable. I have been so little separated from all for so many years that I really feel quite uncomfortable and having no friend with me makes it worse. The day has passed off better than I expected. I have been to one of the Nurseries which has served to pass the time and I shall amuse myself in the same way as much as I can. There has been great floods all over this country and much Hay washed away and spoiled and the Corn is very much beat down. I was in the Market this Morning and before I leave York I dare say I shall talk Yorkshire as well as Mr. ——— in the play. I am now at the York Tavern, but Mr. ——— the Lawyer has taken a lodging for me during the assizes where I am going tomorrow. I shall expect to see the Stairs up and great advancement in the work of the House as well as the Nursery. If the business does not come on by Tuesday, I will write on that day again which you will receive on Friday morning. You have received one or two letters from Mr. Seymour, the Lawyer but they are of no consequence now. The London Mail is just arrived and I shall go and see if there is a letter for me.\n\nKiss all the dear children for me many times and believe me\n\nYours affectionately,\nStephen Hooker.",
        images: ["1.jpg"]
    },
    {
        title: "D.F.Corke to his cousin Frances",
        date: "1831, September 27",
        from: "D.F. Corke in Deptford Broadway, London, England",
        to: "Frances (Gorringe) Hooker b.1789 in Brenchley, Kent, England",
        transcription: "Dear Frances,\n\nYou will doubtless as soon expect a letter from the Popes Nuncio as from me. I think I may claim the right of addressing you once in my life for old acquaintance sake however the friends of my youth have dwindled into the narrowest imaginable space and I anticipate an echo should it be asked, where are they? but without circumlocution. I have occasion for a Hare and believing that I may select you out from amongst the number of Cousins and relatives they say I possess, as the most likely to oblige me, I use the freedom of writing to you, and request the favour of your causing one to be procured for me. I was greatly disappointed when at Brenchley that my short stay prevented me attending to your kind invitation, as, believe me it would have given me great pleasure to have seen all your little family together. God knows when such another opportunity will occur. At present I am suffering with Rheumatic Gout. I am, however, I hope bettering my condition. by the bye I have occasion to ask you a question which if I had had half the dexterity I ought I might have made the pretence for writing. What a pity I did not think of it. I want Betsy’s address in New South Wales, as I know a family going out there. I hope she was well when you last heard from her. I don’t ask anything about Tom because I think he would ask nothing about me. I am only a visitor in this part, but I shall be here some time and if you are kind enough to comply with my request I shall tax you further with the way of packing it up. I want it put in an old Peck or half Bushel Basket and covered with hay as I do not want the person to know what it is I send for, where directed direct by Coach Mr. Corke to be left at the Roebuck, Lewisham, till called for. I have not seen Betsy nor Mary Fuggle since their marriage. May this find yourself and family well. I shall be happy to oblige you in return and I remain\n\nYour affectionate Cousin\nand obedient humble Servant\nD.F. Corke\n\nP.S. At some time it may be Mr. Hooker may have a Spaniel a puppy doomed to be given away or destroyed and when so happening I should be glad of it sent by Tom Mercer to be left at the Roebuck, Lewisham. You recollect me fond of dogs I am as fond as ever and I have now not one. His, or her, fault of being useless or Good for nothing is of no consequence to me I shall care of it. I know Mr. Hooker would not be possest of an ugly one.\nD.F.C.",
        images: ["2.jpg"]
    },
    {
        title: "The \"exchange\" plan and new school rules",
        date: "1832, October 16",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary,\n\nYour anxiously expected letter arrived yesterday morning – We were all much hurt to find that you had written in Bed under such uncomfortable circumstances. Pray let us hear from you as soon as you receive this and give us the full particulars of your complaint. I quite agree with your Doctor in the treatment he recommends namely worsted stockings and warm clothing and no medicine but generous living – I think you should wear flannel drawers all the winter. I have not yet been able to go to London and must now stop to get in my Michaelmas payments and hope then to find time to stay a few days in Town – your Aunt surprised us by a visit yesterday she is come to remain a few days with us and looks and appears to be in better health and spirits than usual. She left them all very well at Harden. William is going to Oxford in a few days – Mister and Mistress Scoones and two of the Children came over today and returned to Dinner. Fanny and little John went with me to see Mister Wells’s Garden at Penshurst. We had a comfortable Dinner at the Inn and were much pleased with the Gardens which were as usual in very nice order. The day was remarkably fine and we enjoyed ourselves very much. Emma sent the Cap you worked for Baby the day after I wrote to you, your Mamma admired it very much and was surprised that you could have worked it so nicely in so short a time. It is quite large enough for the Baby (who we now call Charlotte) is very small though extremely lively and healthy. She is very fat and has as yet been a very good child, that is to say she cries very little and sleeps a good deal. I have been very busy the last few days gathering and storing the Apples of which I have a good crop. Mister Ward has not been down this shooting season at least I have not heard of him – you know my dear Mary that it is impossible for me to refuse almost any request from so kind and affectionate a Daughter as I have always found you to be and so reasonable a one as that of paying for your learning to draw. I am sure I cannot make any objection, though I have enough to do to find means to supply the wants of so large a Family, but the sum is small and I trust we shall rub round as well as we have done. When you write be assured that no subject will be more interesting than what relates to yourself and therefore I hope you will write a long account of your state of health and how you pass your time and what is your food and way of living. You should notice the state of the evacuations and if any irregularities occur you should apply to the Doctor in good time for no person’s health will continue good long if the Bowels etc are not kept regular – you must attribute my writing upon this subject so much to my extreme anxiety for your welfare as you now are away from your Friends and have not the watchful eye of a Father or Mother to notice any incipient want of health. Should you from any unpleasant circumstance or want of health think it desirable to return to England I would come down and meet you at Dover as the sea voyage is so much shorter that way you would be much less likely to be annoyed by sickness or to be kept out at sea by bad weather. But I hope and trust that you will soon be quite well and completely get over the change of living which I am inclined to think has been the principal cause of your illness. I have no doubt from what I have heard of the great respectability of the Family you are with that every kindness and attention will be shown you whilst you are unwell.\n\nYour letter though dated the sixth has the Boulogne post mark of the tenth so that I conclude there must have been some delay in sending it off. We all continue in our usual state of Health and join in love and best wishes for your complete recovery. He saw Mister Joy today but had very little time to talk to him. He said Miss Joy was well. I wish as much as you can do that I could afford to send Ellen over to you as she is now quite well and appears very hardy – I went out shooting alone on the first of October and though I had very little sport I bore the fatigues of of the day better than usual & enjoyed myself tolerably well. I am just now going on with the long walk which could not be proceeded with during the summer. I am sitting up finishing this letter after all the Family are gone to Bed and as the fire is out & my stock of news exhausted I must conclude by again expressing my anxious hopes for your comfort & happiness trusting that you had recovered the use of your legs long before your letter reached me. Expecting to hear from you in a few days believe me to remain my dear Mary\n\nYour very affectionate Father\nStephen Hooker",
        images: ["3.1.jpg","3.2.jpg"]
    },
    {
        title: "Domestic plans and the exhaustion of news",
        date: "1833, February 4",
        from: "Frances (Gorringe) Hooker b.1789 & Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary\n\nI am not much in the habit of letter writing as you know but now you are so far from home I cannot refrain from the attempt and feel assured that a letter from your Mother will be acceptable to you. I know my dear Mary would be gratified could she see the little group around her Papa while reading her affectionate letters and how anxiously we wait the arrival of the Post when expecting one from her. I need not say how happy we shall all be to see you at Easter and shall think it an age till that time arrives when I hope we shall all meet except poor Stephen who goes to School on Wednesday. He is very much grown and I think very much improved. The Twelvemonth we agreed with Madame Pichon having expired we think it best to adopt our old plan of having a Governess in the House that the children may all have an equal share of Education. Clara & Ellen are delighted at the prospect of going to France. We all here think the exchange would be very desirable and could you find French Girls, I think two would be better than one as it would be sometime before they could speak to be understood. They could come over with you at Easter. Emma, Stephen & Clara went to Marden last week. They are all quite well. Tom is gone back to School. William is at home. He came over last Tuesday to Dinner and went home on Wednesday morning. He thinks little Charlotte so like your Papa. She is quite a little pet and will hardly allow me to go out of the room without crying after me. She is I am in hopes looking better but she is very small of her Age. I felt rather disappointed at your buying a drawing box as I had intended to have made you a present of one as soon as I received my money but when you come at Easter you can make choice of something else. I reserve the other half of my paper for your Papa and Fanny – write soon\n\nBelieve me to remain my dear Mary\nyour affectionate Mother\nF. Hooker\n\n---\n\nMy dear Mary\n\nI enclose the other half of the five Pound note. I will if I can come down to Dover to meet you & perhaps bring some of your sisters at Easter when you can return with us but I am not quite sure whether we shall decide upon that plan or whether it will not be more economical for you to come by the Coach to Rye & for us to meet you at Rye which ever plan we fix upon depend upon it we shall all feel as anxious to see you as you can be to return Home. I am well aware what your feelings must be at remaining so long absent from Home and all your relations, but I am also convinced that you will hereafter reflect with great pleasure upon the time you have spent at Boulogne as you will no doubt receive great benefit from it. Fanny intended writing to you today but is so much engaged in preparing Stephen’s things for him to take with him on Wednesday when he goes to School again. I am just going to Tonbridge with Emma & Stephen when I intend putting this Letter into the Post. I must therefore hasten it to a conclusion & promise you that you shall hear again from us soon – do not neglect to continue your Journal. We have read it over with much pleasure many times – they were all attending to Emma’s & Fanny’s reading it yesterday when little John became impatient & said in his hasty way do put away that tiresome Journal you have read it a thousand times. His Mamma said I shall tell Mary what you say John, he immediately answered no pray dont for she wont love me if you do. Your last letter was brought to me in bed and as most of the Children were up they hung all round me to hear it read. Little John got into bed with me and after listening some time he snatched my Night Cap off and began tickling me in the face with the Tassell and it would have amused you very much to have seen his little tricks – Emma has been engaged all the morning making Cakes etc and seems lately to have taken a great fancy to learn the art of Cookery. Perhaps you can bring her home some receipts of French dainties - Your Mamma desires me not to write across her part of the Letter as she fears that you will not be able to read it. I continue to enjoy the same state of Health as I have done for some time past as do also all the rest of the Family though we are in hopes Fanny continues to improve in her looks & strength – do not trouble yourself at all about Mr de Flos & his roses. I only mentioned it thinking it would be rather amusing to you & it is just possible that he may have some thing curious that I should like to have. We have been thinking that Easter will be a time when there is no sort of Fruit or other luxuries of the Garden & too soon for the Roses & some other Beauties but it is usually a very pleasant time of the year and the walks are generally dry & pleasant about that time & I think dear Mary the weather must be very extraordinary if we do not enjoy ourselves very much during your stay with us. As I wrote to you so lately & intend to write again very soon I must conclude assuring you of the continued love of all your Brothers & Sisters & believe me now & ever\n\nYour affectionate Father\nStephen Hooker",
        images: ["4.1.jpg","4.2.jpg"]
    },
    {
        title: "Mary's health and school life in France",
        date: "1833, May 11",
        from: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        to: "Frances (Gorringe) Hooker b.1789 & Stephen Hooker b.1779 in Brenchley, Kent, England",
        transcription: "My dearest Mamma\n\nIt is Sunday Morning and I have half an hour to dispose of before breakfast which I feel great pleasure in dedicating to you. My thanks for dear Papa's long and very affectionate letter I will confine to the other half of this letter which I intend addressing to him. Oh Mamma you know not how utterly melancholy I was for the first fortnight. I feared my short stay at dear home had quite spoilt me for School business. Dinner was the only meal at which I could eat anything and for the first four days I had a continued headache and sensation of sickness, after which my old complaint the colique came on, from which I have been suffering constantly since till yesterday when I was much better. This you will easily grasp helped only to make me more triste. My only consolation was to get alone that I might indulge my reflections by giving way to tears. Yes, tears of grateful remembrances. Oh how often, very often, do I think of you all and can hardly believe that the now calm and beautiful ocean divides us, so true do I find these beautiful words of Burn \"Time but the impression deeper makes As streams their channels deeper wear\". But I shall tire you and I am really ashamed of thus egotizing but I am encouraged by dear Papa's letter and must therefore continue it a little longer by referring to that part of his letter in which he recommends me to follow the prescriptions he has been so kind as to get for me. Mrs Rochefort had procured for me at the Chemist's a small bottle of steel wine which he recommended with directions to take a teaspoonfull in a little water three times a day. I had not taken any of it till I received Papa's letter when I was induced to begin. I have now just emptied the bottle and do not find that it has any good effect. I have procured the iron filings and intend sending for a bottle of wine and making the mixture as advised by dear Papa. The aperient medicine I have of course no occasion for. And now dear Mamma I cannot help expressing my anxiety for my dear sister Fanny's health. Would not the same things recommended to me be of service to her. She was I am sure during my stay at home far from well. Let her therefore dear Mamma share my part as well as her own of your maternal care. I cannot help wishing that she should pay a visit to Miss Brisenden or some one else for change of air and scene. Let me hear particularly how she is. I have not yet been with Mrs Barlow to the ———. Miss B was not well enough to be of our party and it was therefore put off till another day. I have been to tea there since and find her very amiable. How does Baby go on I suppose she will soon begin to feel her feet as the nurses say she is so very small and light that I should think she would run very soon. We have a new parlour boarder a Miss Fry between forty and fifty. I should think a complete old maid poor woman she does not understand a word scarcely of French although she has been living in a school here for the last six months. I do not know what to make of her. She seems a worthy disposed woman but very weak and so very odd that one cannot help laughing at her sometimes. She is so like Mr James Fry that I asked her if she was any relation. She says not but that Mr John Fry is her Uncle who lives at Sion Cottage, Tunbridge Wells. I trust you will write to me dear Mamma by Madame Pichon. I know not what to do about leaving off my drawers. They are very thick and warm but I am so constantly having bowel complaints that I am almost afraid to leave them off. If I had thought of it when at home I could I daresay have found some old thing that would have served to make them of by adding a little piece of new at the bottom of each leg. Emma Weedon is not yet returned which makes me anxious that Papa should speak about my having my room to myself as they have hinted that when she comes back ——— will return with her and spend a few days as they can put up another bed in my room for her. This I have just been thinking will be very unpleasant for me as I have lately been obliged to get up once or twice every night and am likely to continue so no matter what I eat. And now dearest Mamma I must say Adieu. Remember me most affectionately to my dear Sisters and little John and be assured of the sincere and dutiful regard of your Daughter\n\nMary\n\n---\n\nMy dearest Papa\n\nHow can I sufficiently thank you for your long and affectionate letter and your kind anxiety which it evinced for my health and happiness. Need I say how much I regret that my staying a day at Dover should have caused any uneasiness to my dear Friends at home. Who would have thought of William being at Boulogne at the time you called at Marden and how unaccountable that they should thus veil their proceedings in mystery. It struck me however the moment I read your letter what it was that called William so hastily to Boulogne. I may be mistaken in my conjectures but I cannot help attributing it to the hope of some Church preferment. Mr Simmons the Clergyman of the lower town has had an order from the Bishop to return to his living in England where he was. I think when my cousin was here the Subscribers had elected another and sent the petition in to the Bishop but we had notice last Sunday that he would not allow him to accept it and the Subscribers are therefore requested to meet on the fourth of June for the purpose of electing another, but this I daresay William's Friends here have made him acquainted with. I feel really quite vexed with him for being so very ceremonious and uncommunicatable with so kind an Uncle, but I am inclined to think that it is not his own wish to behave in this manner. Have you dear Papa yet been to London. Mr Pichon is expected with his Lady in the middle of next month and as you will most likely see him when you are in Town I have two or three things I wish very much you would mention to him that he might speak to his Sister about. In the first place you desired me to take a great deal of exercise. Now we never walk out more than every other day, frequently not so often. You advised me to ask to walk out with one or two of the young ladies and I did so but they did not seem to approve of it. I did not urge it as I thought the request would look better coming from you. I am convinced that if I do not have constant exercise I shall become fatter and more uncomfortable than I already am. It would not be right nor do I wish it to join in any fashionable promenade by myself, I should take a quiet country walk, there are one or two here younger than myself who go out alone and surely if I am competent of conducting the School to Church I am of taking a walk with one or two little girls. In the next place I would like you to say that you wish me to have a bedroom to myself. Think how miserable it must be for me to be crammed in a little bed that I can scarcely turn in, besides even if they offered to have another bed put in the room, Emma Weedon is not the girl that I would wish to share my room with. She pays nothing more than the others and there is no reason why I am to be inconvenienced. I, as the English Teacher, have certainly a right to a room to myself and if they break through this part of their engagement they can have no claim upon me. I fear you will think I am very fidgety but I find there is nothing like shewing a little independence with the French. I would not wish them to think I had written to make complaints but rather as your wish from what you had heard me say when at home. Dear little John how often I think of him and wish I had him with me. Kiss him a thousand times for me. I could scarcely believe what I read concerning Mr Hodgkin. How melancholy to think that he should have thus debased himself by stooping to the committal of acts which must for ever exclude him from the society of his old Friends and Neighbors and above all ruined his own peace of mind for ever. I am indeed very sorry to hear of it but surely it is not quite as report says, no I cannot think quite so bad of him poor man. If it is so and he has really made over his property to his brother and sisters what can he mean to do. He must I think be insane. Is he in your debt. The heat of the Weather here is quite oppressive. I scarcely know how to bear it. How delightful the grounds must begin to look. I have made up my mind that one of my first walks without the whole School shall be to Mr de Flais. I fear the time will pass very slowly till I see you all again but there is nothing to be conquered but by patience and perseverance and I trust next summer to have become a good french Scholar, to have got over the disagreeableness of the french living and to be reaping the benefits of my stay here. I am sure you must be tired of this spiritless letter. Let me dearest Papa hear from you very soon. Tell my Sisters I hope they will send me each a letter by Mr Pichon and you I know will not neglect writing. You can make up a packet of letters which I am sure Mr P would not refuse to take. Suffer me once more dear Papa to ask you to speak or write to Mr P upon what I have said but not in any way to make anything unpleasant between us. Do not be too anxious about me I continue pretty well and trust to continue so. I trust you are all likewise well. Pray watch over dear Fanny's health. You know not how anxious I am about you and her. The others are all I think in very good health. I have filled my paper and must conclude by expressing dear Papa the sincere love and affection of your very dutiful daughter\nMary Hooker\n\nP.S. My love to Emma and I hope she will not forget to use her influence with Miss Joy in recommending this School. The collar she cut out for me is thought such a good shape that they have taken a pattern of it.",
        images: ["5.1.jpg","5.2.jpg","5.3.jpg"]
    },
    {
        title: "Arrangement for Ellen's exchange to France",
        date: "1833, June 12",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary\n\nBy some unlucky accident your letter though dated the sixth did not arrive till the 11th. We have no objection to the plan you have arranged respecting our receiving a young French Demoiselle in exchange for Ellen who is to be under your care at Madame Pichon's no charge being made by either Party, Ellen to have every advantage of education that the young Lady we receive in exchange will have here who will be treated exactly as one of our Family. We have not yet engaged a Governess but we hope very soon to have one as there are so many advertisements in the daily Paper which we now take. It now remains to deside when & which way Ellen is to go to Boulogne. After all considerations we think that Ellen should go from London with Mr & Mrs Pichon who we understood were going the 25th but you say they are expected the 20th this we shall be able to ascertain when Stephen comes Home on Saturday next as he will call in Cambridge Street to learn what day they leave - so much for Business. You do not say my dear Mary half enough about your Health. Pray give us full particulars in your next Letter. Do you take the medicine & how does it agree with you. I am in hopes you are improving in your general Health as you write in better Spirits. We, that is Fanny, Emma & myself went up to London as we proposed on Friday afternoon & arrived at the Post Office just in time to put in your Letter & then went to sleep at the 4 Swans - in the morning we drove to Cambridge Street where we took Madame Pichon with us to Ealing & took Stephen with us to the Exhibition of Flowers at the Horticultural Society's Garden where we spent the afternoon. There was a great deal of Genteel Company there supposed to be more than Four Thousand People. The show of Flowers was not so splendid as I expected but the Weather was beautiful & the music & the Company etc made it very pleasant - we brought Stephen back to London with us,on Sunday we dined at Mr Pichon's & walked in the Park & Kensington Gardens,on Monday we went to see the Zoological Gardens which were rather too much crowded with Holiday Folks to make it agreeable, it being Whitmonday. Tuesday Morning we drove about London & came part of the way Home, in the evening slept at Farningham, where Stephen left us in the Morning of Wednesday, after which we drove Home to Dinner. I fear that I shall be too late for the Post if I write more than just to say that we are all quite well & that they all join me in love & kind remembrances to you\n\nbelieve me to remain\nMy dear Mary your affectionate Father\nStephen Hooker.\n\nYour Aunt Mrs Leaney is now staying with us, I dont know whether you recollect her. Your Mother wishes me to say that she will endeavour to get you some silk to match your Frock & send it by Ellen & that she will write to you at the same time.\nI pressed Madame Pichon very strongly to make her Husband write to his Mother about your walking out & having your Room to yourself. She promised me she would do so & had no doubt they would consent to it immediately without any difficulty.",
        images: ["6.jpg"]
    },
    {
        title: "Ellen's health and the Great Storm of 1833",
        date: "1833, September 9",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary,\n\nI enclose five Pounds Bank Note which you will spend upon yourself & Ellen as occasion requires. I know I need not caution you to make it last as long as you can, but at the same time I hope you will not debar yourself or Ellen of any little comforts that are necessary and let me know when your money is nearly all gone that I may send you some more. I think you will do right to purchase a good Blanket or two as the cold weather is coming on (if you cannot have them allowed you) & Ellen should have some Worsted Stockings & be otherwise warmly clad as well as yourself. We are very sorry to hear that Ellen has had such a bad cold & cough. Pray let me know very particularly how she is now as I should rather send one of the others in her stead if the air of Boulogne & the difference of living do not agree with her. If Ellen is very unhappy & wants to come Home do my dear Mary let me know and particularly about her health as I am much afraid if her cough continues long it may become fixt and of serious consequence which will make me always regret allowing her to go to Boulogne. I am very glad to hear you give so good an account of your own health & hope you may long enjoy the blessing of health which is the foundation of every enjoyment. Emma and myself were much pleased with your kind remembrance of us upon our Birthday. We spent the day very pleasantly, William came over from Marden on Sunday last and went out shooting with me & Mr Leman on Monday. Emma went with William & me to Marden on Wednesday where we had a day’s shooting & returned Home in the Evening. They are all quite well there. We are afraid Mrs Pichon must have had a very rough passage. Fanny & little John went with me to Tenterden on Friday the 30th afternoon and returned after the storm of wind & rain commenced. The wind being at our backs we felt but little inconvenience having the head of the Chaise up. We could not help thinking of Mrs Pichon who we concluded had set out from London before the storm begun. We hope to hear that she arrived safely & with less inconvenience than we expect. Miss French our new governess arrived on Thursday week. She appears to be a very well disposed & industrious young Person & seems to promise to turn out everything we could wish. The storm was very severe and continued all Friday night Saturday & Saturday night & with less violence on Sunday, in short we have had very windy weather nearly all the last week. The Hops are very much spoiled & the Poles much blown down & more than half the apples shaken from the Trees. The Newspapers give us dreadful accounts of Shipwrecks at Sea but that of the Amphitrite near Boulogne appears to have been the most shocking – of course you have heard the particulars as well as ourselves. Miss Obert is quite well & desires me to send her love to her Parents & Friends, including yourself & Ellen. She also wishes me to say that she hopes to have a Letter from Home very soon. Your Mamma wishes me to tell you that she will send you the money to buy her Watch when we write next. Poor Mr Barton Mr Fuggles’s Son in Law died this morning he has been in a decline for some time past. Miss Obert does not seem quite to relish the close application & confinement of the school room or rather I should say she did not at first for she seems now to become more reconciled to it. Before the Governess came the Children had most of their time at their own command, when she appeared as cheerful & happy as possible. Your Mamma & all the Family are quite well & send their love to you & Ellen. Pray write as soon as you receive this. Give my love to Ellen & tell her that I should be very much pleased to receive a letter compleatly of her own scribbling when she could tell me all her thoughts, wants & wishes.\n\nBelieve me\nMy dear Mary to remain\nYour very affectionate Father",
        images: ["7.jpg"]
    },
    {
        title: "Mary’s future in France and Emma’s succession",
        date: "1833, October 9",
        from: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        to: "Frances (Gorringe) Hooker b.1789 in Brenchley, Kent, England",
        transcription: "My dear Mamma,\n\nHaving an opportunity of sending a letter free of expense to London I feel great pleasure in dedicating it to you. I fear you will think it very negligent in my not having answered your affectionate letter before and expressed to you our thanks for the parcel. I received my dear Friend's letter which Papa so kindly forwarded to me and the few words traced by his own dear hand assuring me all at home were well were the first that were regarded by me and afforded me the sincerest delight. Miss Catt's was a very affectionate letter written as you perhaps might see in french. She tells me of a delightful tour she has had with her Papa and Sister to the Isle of Wight, visiting the Seaports of Dorset, Devon and Cornwall just to the Land's end. What a delightful excursion. How I should have enjoyed it. She tells me that if she meets my Sisters at the Ball at Hawkhurst next year she trusts they will have an opportunity of conversing a little together. Ellen is very well. She now and then coughs a little but it is so trifling that it is scarcely worth speaking of and appears to arise from phlegm. I have just asked her about it and her answer is \"O I have not coughed for a long time. I had something in my throat when you heard me\". We are expecting to hear from you every day. It is now about a month since we had a letter. I flatter myself that you are all as well as myself looking forward to the happy time when we hope to meet again on the fifth of January. You know I shall have been here a year and a half, the time arranged for my stay. Am I to stay longer in France. I am not so conversant in French as I could wish but still I can not forego the thoughts, the delightful thoughts, of seeing you all again this Christmas. It is I know a terrible time to cross the channel but we must hope for the best. I have met with a Lady here who says she has no doubt she could get me a comfortable situation in a french family in which I should be received as one of its members. I should teach the Children English and be remunerated by a small salary. As I am already tolerably advanced in french and should in a genteel family meet with more comforts and advantages than in a School (where you must remember half indeed nearly all the boarders are English) would it not be more advisable for me to enter into some such engagement than to continue in this. I should not devote more time than I now do to English and should be constantly with French persons. Sundays I should of course, were it in a family of the Catholic religion, agree to have always to myself. I should of course my dear Mamma much prefer remaining near you in England, but I feel it my duty to endeavour now to do something for myself. Tell me if it entirely meets with yours and dear Papa's approbation. Let us however trust that nothing will intervene to prevent our happy reunion at Christmas and who knows but fate, no I will not say fate, but an overruleing Providence, may have something better in store for me than a separation from all those who are endeared to me by the nearest and dearest of ties. Surely some comfortable situation might be met with near you. I shall at least hope so and enter into no fresh arrangement till I have seen and conversed with you all again. Is it still Emma's wish to succeed me here. I would wish her quickly to decide. The time is now drawing very near and the Miss Pichons may find someone else, indeed I know of several who would have been glad to have taken it and of one lady whom I have been told is to come whenever I leave. If it is Emma's wish however to come, I trust I shall be able to manage it for her. I should not however I think advise her to agree for more than a twelvemonth as she might perhaps when she could understand and speak a little french meet with something more advantageous in a family. Madame and Miss Pichons have always been remarkably kind and attentive to me and I think she would be very happy here. Give my best love to her and tell her I hope soon to know her wishes on the subject which I would communicate to Miss Pichons and endeavour to make every arrangement in order to render her stay here advantageous and comfortable to her. If she does not come I should not like to leave Ellen. If you fear Emma's crossing the Sea during the Winter and think it better that we should both remain where we are till the Spring, I will endeavour to reconcile my own feelings to passing another Winter in Boulogne. At any rate it must be so arranged as for us to pass two or three weeks at least together before another separation. I think it would be more comfortable for her to come here before I leave and get a little initiated in the french manners etc etc etc. I think in my last letter I told you I fancied Mrs Pichon Junior very much altered, poor woman, I feel I have done her an injury in saying so. I have since seen so much to account for any coldness I might imagine in her manners that I am sorry I should have ever remarked it. I cannot however explain to you now, suffice it to say that she is better in health I think than she was, that she appears to get more settled here, is perfectly happy with her husband and is I am convinced the same amicable and worthy person I ever considered her. I spent the day with her last week and enjoyed it very much and talked over old times. I have seen her today and am going to spend the evening with her. How does Miss French get on. Do you continue to like her. Is she clever and does she draw well. I am anxious about the latter as I hope to continue with her. I trust you continue to find Honorine amiable and agreeable, remember me kindly to her. I find I must conclude as I shall have no more time to write as the young lady who is to take this leaves at 6 tomorrow morning. Remember me most kindly to dearest Papa, Fanny, Emma, Clara and the little ones. Ellen likewise desires her love to all. Kiss little John a thousand times for me and believe me to be dearest Mamma\n\nYour very affectionate Daughter\nMary Hooker\nBoulogne Sur Mer\nOctober 9 1833\n\nP.S. Do dear Mamma if you have not written to me when you receive this do so directly as I am so very anxious to hear from you. As dear Papa has so kindly furnished us with money I am determined to pay for Ellen's learning dancing for a quarter, it is but 12 francs and I shall pay it in advance to ensure my not spending. I am in hopes that it will improve her appearance. My candle is burning so dim I can hardly see. I must say good night. I hear Papa has been staying a fortnight in Town. Is it true. I have written to Stephen by the same conveyance as I send this. Adieu. Adieu.",
        images: ["8.1.jpg","8.2.jpg"]
    },
    {
        title: "Tragic death of cousin Stephen Hooker",
        date: "1833, November 18",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary,\n\nYour poor cousin Stephen has met with a dreadful accident. He was out shooting with some of the young men at Mr. Le Geyts on Saturday last when one of their guns went off accidentally about two o'clock, and the charge lodged in poor Stephen's leg just below the knee. He was taken home and Mr. Perry attended him immediately and afterwards Mr. Joy from Staplehurst, and then Dr. Welsh from Maidstone but he lost so much blood and his constitution being so very delicate he sunk under it and died poor fellow about 6 o'clock yesterday (Sunday) morning. This event as you will naturally suppose has thrown the family at Marden, into the deepest distress. We had a letter which was sent off very soon after his death to inform us of the melancholy event. Your Mamma and I went off immediately to Marden. I will not attempt to describe the day we spent there but leave you to imagine the sufferings of the relatives of a young man whose gentle and amiable disposition had endeared him to all who knew him, cut off in his prime of youth by so sudden and dreadful an accident. If you have not laid out the money I sent, you will of course buy mourning for yourself and Ellen and let me know what you want more. Your sisters will have Bombazine Frocks and black silk bonnets trimmed with crepe. This event has made me very nervous and I cannot think of parting with Emma at present, and it makes me look forward with anxiety for the time when I am to see you and Ellen again. I hope, therefore, that you have not made any arrangements for Emma yet. We are as well as can be expected after the circumstances I have related and all join in love to you and Ellen.\n\nBelieve me to remain My dear Mary\nYour affectionate Father\nStephen Hooker\nBrenchley\nNov. 18 1833\n\nLet me hear from you directly. William is at Oxford, and will not hear of his brothers death until tomorrow morning.\n\nEDITOR NOTE: This Stephen, who died was the son of Thomas and Sarah, of Jewell House, Marden.\nThe William referred to at Oxford became the Rev. William Hooker.\nThe letter is written by Stephen who married Frances Gorringe, and was father of the Stephen who went to U.S.A. and New Zealand.",
        images: ["9.jpg"]
    },
    {
        title: "Mourning the tragic loss of cousin Stephen",
        date: "1833, November 25",
        from: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        to: "Stephen Hooker b.1779 & Frances (Gorringe) Hooker b.1789 in Brenchley, Kent, England",
        transcription: "My dear Papa,\n\nThe affecting news of the sudden and dreadful death of my poor Cousin Stephen has filled me with so much grief that I have hitherto been quite unable to address you on alas so very melancholy a subject, but the fear that my silence may perhaps only add to your distress induces me to perform the painful task. Poor fellow, I can scarcely believe it possible that I shall never more see him in this world, him whom I last saw in the bloom of youth and health. I remember his last kind wishes at our parting that I might have a safe and pleasant passage. I almost fancy I see him now, but no, he is gone, he is sunk I trust into an eternal rest, leaving us another mournful proof that the lives of even the youngest of us are so short and uncertain that even as the flowers of the field so we perish. Death in every stage of life is most solemn and affecting how doubly so is it in the case of my dear Cousin he who by his many good and amiable qualities endeared himself I think I may say to all who knew him, to see him stretched on the bed of death he who had a few short hours before left his home in health and gaity, must I fear have been almost too much for his poor family. Their loss is indeed great and I fear that it will be long, very long, before they will be able to at all reconcile themselves to so terrible and apparently severe a dispensation of Providence. Poor Elizabeth, what must she not feel at the loss of so very affectionate a Brother. She always, I thought, appeared so particularly fond of him. How I wish I could see her, poor girl, that I might endeavour in some way to alleviate her sufferings. I almost dread its affecting her delicate health. William too, melancholy thought, denied the consolation of being present at his poor brother's death. I have dearest Papa followed your directions and bought mourning for myself and Ellen, an account of which I will give to dear Mamma. Removed from all my dear Friends you have, I am sure, no idea what I feel on this melancholy occasion, obliged to exert myself in the purchasing and making our arrangements for mourning. We put on this last token of respect to the memory of our lamented Cousin yesterday, Sunday, but why should I thus dwell on and still mourn over this affecting event. He has I trust left this troublesome world for a much happier one and is now doubtless where the Wicked cease from troubling and where the Weary are at rest. I am looking forward with terrible anxiety to the time when I hope to see you all again. Oh, Heaven grant nothing may prevent our meeting you all in health and safety. I fear that it will be almost impossible to name the day of our crossing of the Channel as the weather will doubtless be very uncertain and the Packets leaving only three times a week on days which the wind is most favourable. Let me therefore my dear Papa know if I put a letter in the Dover Post in the Evening whether you have it the following morning, if so I should not write to you till I am at Dover which will enable you to meet me at Maidstone the same day, that is to say the one following that on which I shall leave France. Ellen is quite well and unites with me in desiring to be most affectionately remembered to you at dear home.\n\nAdieu my dearest Papa, may the Almighty watch over and preserve you long in health and peace is the fervent prayer of your very dutiful Daughter, Mary\n\n---\n\nMy dear Mamma,\n\nI have just time to say a few words more and thought that perhaps you would like me to give you a little account of the manner in which it has been my melancholy office to lay out the last five pounds sent me for a far happier purpose. Bombazine is I fear much dearer here than in England, but as I found my Sisters would have dresses of it and as I wished to have the same kind as theirs I have bought myself one which has cost me about a pound 5 without lining or making. I have likewise had a silk bonnet trim'd with Crape. I have bought Ellen a Merino lise for you know she is very thoughtless and I feared a bombazine would be torn directly. It is rather cheaper, very pretty and considered quite as deep as the other. I had just had her cloth frocks arranged for her, which as they are so dark will do very well for her to wear in the house. I have bought a very common black cotton gown to wear myself in the house, which has cost me about 7 francs. So you may guess it is not too good. I have given my plush bonnet to be dyed, which I think will make a very good one for Ellen, trim'd with crape. We have had our dresses almost entirely lined with old materials, thus have I, my dear Mamma, endeavoured to lay out my money as economically as possible, and trust it will meet with yours and dear Papa's approbation, but with all my care I find that my stock of money will be almost exhausted, if not quite, when I shall have paid the expenses of the Dressmaker and the numberless little charges attendant on our going into Mourning. I have been writing this letter in my room and am so cold and chill that I trust you will pardon its brevity for I really have no more spirits. Oh, those fatal terrible guns. Remember me to my Brothers and Sisters and believe me ever to be your very affectionate Daughter Mary Hooker\n\nP.S. My eyes are much better. Mrs Obert wishes very much to hear immediately from Honorine.\nLet me hear how you all are soon and likewise of our distressed Friends at Marden.\nEllen, I suppose, will return and I shall consequently leave her summer things locked up here. I have given up all thoughts of it at present. I feel I should not have spirits enough to leave you again for a foreign shore. Adieu, Adieu.",
        images: ["10.1.jpg","10.2.jpg"]
    },
    {
        title: "Instructions for return from Boulogne",
        date: "1833, December 11",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary\n\nAs the time is so near when we are to have the pleasure of seeing you and Ellen again I wish you to write immediately and let me know how much money you will want to pay all your debts before you leave Boulogne as I think it would be best to clear up every thing in case neither Ellen nor you or Emma may return there. When I say all your debts I do not suppose you have any except the Drawing Master and Doctor and perhaps a few others more trifling. We think you had better bring all Ellen's things as well as your own. When the time for your leaving Boulogne is arrived you should have all your things packed ready and take the first opportunity of the Packet's sailing if the weather is fine, but by no means set out if the weather is at all inclined to be stormy or if it had not been quiet for a day or two before. The Packets are such a short time coming over to Dover that there is but little fear of a change in the weather if it is fine and still when you set out, but by no means let them persuade you to come over if it is at all rough. You will of course write to your kind Friends at Dover and get them to let you sleep at their House and then set off by the Van to Maidstone. When you land at Dover write to me and direct your Letter by Cross Post as I shall get it a day sooner than if it goes to London that I or Stephen may meet you at Maidstone. Should it so happen that we do not get your Letter in time and that we are not at Maidstone when you arrive there you must come in a Post Chaise which will bring all your luggage. Should any difficulty arise you will of course apply to Mr Monckton. I wish you particularly to purchase a couple of very warm woollen Cloaks of some common cheap thick sort and you must both be well wrapt up with worsted stockings etc for you will find it dreadfully cold on the Water and also in the Van. The Cloaks will be very useful afterwards when we go out in the Chaise this winter time. You must let me know the amount of all these and every expence that you know of that I may send you money enough. We wish you to bring all yours and Ellen's things but you had better not say anything to Mrs Obert or the Pichons about Ellen's returning as we are not decided what to do yet. I am going to Marden in the Morning to bring your Cousins Elizabeth and Harriet who are coming to stay with us. We received Stephen's Holiday Letter on Sunday. They break up on the 21st but as I am going to London on Monday next I have written to him to meet me at the Coach Office which I have no doubt he will have no objection to do. In Stephen's Letter he expresses much pleasure at the thoughts of seeing you. He says we all saw you when you came Home but he did not. As I am going to write to you and Ellen and believe me to remain\n\nMy dear Mary\nYour affectionate Father\nStephen Hooker",
        images: ["11.jpg"]
    },
    {
        title: "Travel plans and financial needs",
        date: "1833, December 15",
        from: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        to: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        transcription: "My dearest Papa\n\nYour long looked for letter has at length arrived cheering me with the news of the health of all those at dear home, but when I tell you it had been my cherished intention to have passed Christmas day in dear old England, that I had even in imagination believed myself seated by your side in the family circle after Dinner enjoying the society of all those from whom I have so long been parted, you will easily guess that I was a little disappointed at finding my letter contained nothing necessary to defray the expenses of my passage. You will perhaps laugh when I tell you that when the Post Man brought your letter I was gone out to make enquiries when the Packet left and found that the weather being favourable I should be able to sail for Dover either on Monday or Wednesday next and as we should not be able to get our clothes from the Wash in time to go on Monday I have determined leaving on Wednesday. One of the young Ladies had arranged to take my situation whenever I left during the Winter months. The Lady I mentioned to you as likely to be my successor Miss Pichons now object to receive. Miss Lacey has behaved very amicably about it and although she pays for this month has offered to take my charge upon her whenever I feel inclined to give it up. I should tell you however that Miss Pichon has agreed with Miss Corry for the winter months only entirely with a view of Emma's continuing it afterwards, thinking it would be more pleasant for her to return when the weather became a little warmer. I am surprised to find you are undecided as to Ellen's returning as it appears to me that the six months she has passed here will be quite thrown away. I shall say nothing to Miss Pichon or Madame Obert, but they will no doubt tell me it would be the height of folly and extravagance to take all her Summer Clothes. Allow me dear Papa to hint to you that it would be prudent to make some arrangement with Madame Obert as to Honorine's remaining if Ellen returns. She will of course remain the same time as Honorine has passed with you but in case she does not you cannot I am sure afford to board and educate her, that is Honorine, for nothing. Should you not therefore write to Mrs O. or come to some terms. You must not be angry with my presuming to give my opinion. Miss Pichons seem delighted to think I shall remain with them a few days longer and some of the Girls tell me in badinant that I may rest in peace I am not wanted at home. I flatter myself however that it is not so and that you would all of you have been as happy to have seen us a week or so sooner as we should have been to come. I thought to have agreeably surprised you by a letter from Dover announcing my arrival there while you still thought us in Boulogne and thus saved you some anxiety. We have had dreadful weather lately, the Sea as I once saw it from the Ramparts, for there is no going on the Port, was indeed frightful. We hear of nothing but dreadful accidents. Last Tuesday Morning a fisherman's vessel was wrecked almost close to our Harbour containing it is supposed seven or eight persons. They had left the evening before, the Weather being tolerably calm. They endeavoured to swim, but the Sea was in such a dreadful state that they very soon sank, it being impossible for any one to rescue them. One poor man has left a Widow and five young children to mourn his melancholy fate. This account with many others that I could mention of course make me dreadfully nervous at the thoughts of so soon passing that wide ocean, which has alas lately proved so very fatal to many. I cannot even bear to look at it. Ellen has fortunately no fear and I must endeavour likewise to shake off mine. Be assured dearest Papa that I will not venture if it is very rough neither would Miss Pichons allow me to. How kind of you to wish us to buy warm Cloaks etc. From your desiring us to Purchase two, I see that I have never told you that I have already one myself. I had it at the beginning of the Winter as I was persuaded I could not cross the Winter without one. It is a very neat comfortable Merino, and you will judge very warm when I tell you it is lined throughout. Ellen I thought did not require one as she has such warm cloth frocks and the use of my fur tippet and muff. As she is to return to England however she will no doubt find it very comfortable and I shall immediately purchase her one. I suppose I shall not be able to get anything under a pound without the making for everything in the cotton and woollen way is dreadfully dear at present. Ellen is quite well and happy. I have a tiresome cold and cough which as I have been teazed by for some time past I hope I shall be able to shake off before I see you. Remember me most kindly to my Cousins if they are still with you and ask them if there is any thing I can bring for them from Boulogne. Tell Stephen I am sure he cannot look forward with more pleasure to our meeting than I do. I trust that both you and he will meet us at Maidstone. Do you know where the Van stops. Where had I better tell him to set me down. I suppose we shall get to Maidstone about five in the evening when I hope to meet you. If not I shall wait half an hour and then if you my dearest Papa do not make your appearance I shall obey your orders and take a Post Chaise. What had I better do about my luggage. Do you remember my very large trunk and that of Ellen's. I fear that the Van will not be able to take all our boxes for I have besides a new case which I have been obliged to purchase for our bonnets and my small paper trunk. Is there any Carrier from Dover to Brenchley. Will you dear Papa think of this and tell me what to do. Let me know if there is any thing that either you or Mamma wish me to bring you from France. I was thinking of Wafers for Babeches the other day, but Ellen tells me she thinks you have had enough of them. Miss Pichon has just given me the bill for my drawing, Doctor etc, which together with the Dentist, Pharmacien etc and 8 francs Miss Pichon charges for Cahier paper, which she always furnishes and which I think is very reasonable for a year and a half, amounts to about five pounds, then there will be Ellen's Cloak, a pound, and the making I suppose about 5 francs. You dear Papa know as well as I how much my journey will cost me, ten shillings each for our passage over besides the fees to the Steward. You must likewise remember that our luggage will cost something to take down to the Packet and then again at Dover. I have just thought that on New Year's day it will be necessary to give five francs each to the Servants. I feel therefore that we shall not be able to do with less than ten pounds. I grieve to think of the constant trouble and expense I cause you. Think of your poor Mary however as one whose study it will ever be to prove that she is sensible of all your repeated kindnesses. Remember us most affectionately to dear Mamma, brothers and sisters and in the hopes of so soon being reunited, believe me to assure you of the devoted love of dearest Papa\n\nYour very dutiful Daughter\nMary\n\nP.S. Ellen is gone to Mrs Obert's to Dinner and I am invited to go with her again tomorrow as I preferred it to today. I saw her yesterday. She hinted at what was to be done if Ellen should not return. I told her in that case she would pay you instead of Miss P. but that most probably she would. This she assented to, so perhaps there is no necessity for you to write to her.\n\nGive my love to Honorine and say all her friends are quite well and that she is to receive a parcel and letters by me. Tell me if you please if this letter comes right. Might I dear Papa desire you to write on thinner paper as I have double postage for every letter I get. Pray let me hear from you that I may soon be with you.",
        images: ["12.1.jpg","12.2.jpg"]
    },
    {
        title: "Father's journey to meet Mary",
        date: "1834, January 11",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy) in Boulogne-sur-Mer, France",
        transcription: "My dear Mary\n\nYour melancholy Letter has just arrived and has caused us all much grief and anxiety on your account. I write this in great hopes that you will receive it on Monday Morning. I intend to set out tomorrow morning in the Chaise to Sittingbourn and go on by Coach or the Mail to Dover where I expect to arrive tomorrow night or early on Monday morning and it will give me much gratification to be on the Pier and see the Packet arrive with you and Ellen. Most fervently do I hope that you are now better and that you will be able to bear the Voyage without more than the usual inconvenience. Should you not be able to come on Monday write to me at the Post Office Dover and at the same time write to your mother who with your sisters and brother will be anxiously waiting to hear of you. At any rate pray write to me at Dover and if you should be worse I shall come over to see you as I am now in tolerable health and shall not mind crossing the channel but I shall wait at Dover till I see or hear from you – should you find much inconvenience in writing you had better get Madame Pichon to write for you. We have been sadly disappointed every morning for some time past at not receiving a Letter from you from Dover and have concluded that the weather was not so fine at Boulogne as here or that when it was fine that the Packet did not sail and as your last Letter dated Dec 24th mention nothing of your being unwell we never attributed your silence to the right cause. You will no doubt easily imagine my dear Mary our joy at receiving your Letter with the Dover Post mark and the disappointment which the sight of the Boulogne mark on the other side gave us and the grief which we all felt at the contents of the Letter. The weather continues very wet and rather windy. If Monday should be a bad day I shall not mind staying at Dover a few Days but do my dear Mary let me hear from you and do not conceal the real state of your health from your very anxious and affectionate Father\n\nStephen Hooker\n\nMiss Obert send her love to her relations and also to you she is quite well and hopes soon to see you with her Letters etc from Home.\nYour Mother Sisters and Brothers all join in love and affectionate remembrances to you and Ellen and best wishes for happy return home. Should you want money you can take that for Miss Obert and I will give her the same amount here.",
        images: ["13.jpg"]
    },
    {
        title: "Mary's arrival at Clay Hill and update",
        date: "1838, February 21",
        from: "Mary Hooker b.1812 (aka. Cardy) in Clay Hill, England",
        to: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        transcription: "My dear Papa\n\nThe Children having a half holiday this afternoon, I feel much pleasure in dedicating the leisure it affords me in writing to you. I am growing very anxious to hear how you all are and trust you will very soon write and tell me. I got here very comfortably with the exception of being a good deal tired and found Mrs Catt apparently very pleased to see me. She welcomed me very cordially but seemed almost frightened to think I should have ventured on so unfavorable a day, and said she did not at all expect me. The Children too on my first arrival evinced more pleasure than I could have expected, which you will admit was very gratifying to me. I felt very poorly for some days after and was troubled with swelling in my legs etc but Mrs Catt was very thoughtful and nursed me with her usual kindness so that I soon recovered. I have for the last few days suffered with soreness in my throat and great difficulty in speaking more than in swallowing arising from cold I think, which makes me feel I must be very careful as the slightest cold appears to affect my unfortunate throat. I have seen Mr Pinon who tells me he is sure it is much swollen and begs me to persevere with the blisters but I have not yet applied any nor do I feel sure that I shall. I go on taking his medicine. I am ashamed of having said so much about my own precious self, but trust to your affection dear Papa to overlook it. Your parcel of plants and seeds afforded much pleasure. The Children are quite delighted with their little Boxes and desire their love to you with many thanks. I hope when you write dear Papa to hear how they all do at Marden. I wrote to Aunt Elizabeth a few days since. Have you heard from Clara or Emma lately. I received a letter from Jane Heys about a week ago which I have not yet answered. She desired to be very kindly to all and begs me to thank you for your kind advice which she promises she will endeavour to recollect. I feel dear Papa that I ought to make a thousand apologies to you and Mamma for this hurried scratch, but I know your objection to such and I will therefore forbear but perhaps you will say that I know also how much you dislike such hasty and untidy letters. This is true, and were my time at my own disposal I would avoid such. It has certainly been written a la note and I must beg you excuse it hoping at dear Fanny's quick and penetrating eye will be able to decipher even my illegible scrawl. With most affectionate love to all believe me ever with much love,\n\nYour very dutiful Daughter, Mary Hooker.\nFebruary 23rd 1838\n\nP.S. I shall be daily expecting a letter and hope you will some of you write very shortly. Again Dearest Papa, Adieu.",
        images: ["14.jpg"]
    },
    {
        title: "Birthday greetings and news from Clay Hill",
        date: "1838, February 23",
        from: "Mary Hooker b.1812 (aka. Cardy) in Clay Hill, England",
        to: "Frances (Gorringe) Hooker b.1789 in Brenchley, Kent, England",
        transcription: "My dear Mamma\n\nI thought perhaps you would be pleased to receive a few lines from me, especially on this your birthday, when I would desire most sincerely to congratulate you and at the same time assure you very dear Mamma how fervently I hope and pray that you may live to enjoy very many happy returns of this day. How does Charlotte get on without Clara. I suppose she sleeps with you. Kiss her for me and tell her that Edmund admired her pincushion very much and many were told to take out the pins in order that they might see her small stiches. Tell Rosa and Julia that their work too was thought exceedingly pretty. The Children desire to send their love to them with many thanks. Have you heard from dear John. I often think of him the last morning and hope he soon recovered his usual Spirits. I daresay he is already looking forward to Easter. Mrs Catt said the other day she was very sorry she had not thought to say before I went home that should you come into this neighbourhood any of you she would be very pleased to see you and requested me when I wrote today that at any time she should be most happy to give you a Bed as well as accommodation for your horse and chaise. She thought you would perhaps like to drive as far as here one day and then go on to Brighton for a day or so, return and sleep here the same day, as it is only a nice drive from home and back. Could you not persuade dear Papa to come. I think you would both enjoy it and it is so long since Papa was at Brighton that I think he would see it very much improved. I should be so very delighted to see you and as the horse would not require much on the journey there would be only the expense of the gates. What sort of a party did Stephen meet at Mr Monckton's. You must tell me all about it when you write. Give my love to him and tell him (for seeing so little of him when at home I fear I forgot to say) that as he has I am sure a good deal of time to himself of an evening, I shall be much disappointed if he does not write to me. I have no doubt he could find plenty to tell me particularly now that he has been to one party at Maidstone I have no doubt he will soon be invited to more and I should be so very pleased to receive a letter from him. You must have quite a small party at home now. Remember me very kindly to dear Fanny and tell her I would give anything to have her here sometimes, particularly when I am left at home alone of an evening and the Children gone to Bed. Then it is I feel I could enjoy all the dear family circle, for I am so incessantly occupied during the day that I may truly say I have scarcely a moment to myself. I cannot know this winter time leave them a moment or they would be in danger of the fire, but I am looking forward to Spring. This very cold weather has been very trying and this is a particularly cold situation. My paper warns me to say Adieu and I must therefore beg you dear Mamma to believe me always with much affect. Your very dutiful Daughter, Mary",
        images: ["15.jpg"]
    },
    {
        title: "Family news, financial troubles, and Ellen's health",
        date: "1856, September 11",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy)",
        transcription: "My dear Mary\n\nMany thanks for your very kind letter which arrived on my Birthday which I am sorry to say was more clouded by sad and unhappy events and reflections than any Birthday I ever remember to have passed. I have had a great deal of trouble lately in Money matters, much more than I can tell you of, which had made me very unhappy at times when I could not drive it from my mind. Poor Ellen continues much in the same state as she has been in for some weeks past, rather weaker and a little more cough. Her spirits are better in general than could be expected, but I can see no signs of her recovery. She has been taking the oil but it does not seem to agree with her as it acts too much on the bowels and she is now taking Cream instead. I had a letter from Snashall this morning requesting payment for your Watch. He has left Marden and is going to America in a few Days, he was here a few Weeks ago and I then paid him my Bill and 30 Shillings for your old Watch which Charlotte has got as a present from your Mother leaving five Pounds due to Snashall for your watch. I understand John owes you the money, but if he does not pay it, I must as I cannot allow the poor man to leave without being paid. Your Sisters are all out and I cannot learn from them to what date you have been informed of the events of this neighbourhood. Clara is keeping House for Miss Saunders, Rosa is staying with Ellen, Julia and Charlotte are gone with Charles Pichon to the Organ and Fanny has walked out some where. Mr Rankley the Artist, who you may have seen at the Rocks at Hastings is staying with us, he has been taking my likeness and has just finished it, it is very nicely done and everybody is pleased with it and think it remarkably like. Mr Storr has returned to the Vicarage, his Tenants left I believe yesterday. John has had great sport shooting. Mr Dobson and Mr Shaw came here on Tuesday. They had a good day's shooting and returned home to Dinner. Charles P. drove over to Marden yesterday with Fanny, Julia and Charlotte. They were all about as usual. Victoire is coming to stay with us on Tuesday. The Hop picking is going on every where in great force. We are glad to hear that Mrs Saunders is much benefited by the treatment at Malvern and that you are enjoying yourself very much. I am reminded of you when watering the little Ferns you brought from Yorkshire. With kind regards to Mrs Saunders and love to you from all here, believe me to remain your very affectionate Father\n\nStephen Hooker.\n\nI cannot close this without saying that we are not at all satisfied with Whittle's cool manner about his Wife. He seems to have made up his mind that nothing can be done for her though he behaves very kindly towards her as far as manner goes his own selfish disposition seems to rule everything - do not say anything about this but I will tell you more when we meet.",
        images: ["16.jpg"]
    },
    {
        title: "Old age and family troubles at Brenchley",
        date: "1857, July 4",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy)",
        transcription: "My dear Mary\n\nSome of your sisters will I trust write to you again soon but you know it wants some effort on their part as it is not as easy to them as yourself.\n\nDo not suppose that I think less about you because you do not hear more frequently from me - you know I am not very fond of sitting down to letter writing particularly this summer time when I keep out in the air as much as possible feeling it refreshing and good for my health and when I come in I often feel lazy and inclined to doze, which is one of the effects of old age - you must not therefore suppose that my neglecting to write to you oftener arises from any want of affection or consideration for you in your solitary and rather melancholy situation. I can assure you that we are not without troubles and vexations enough at home. I have been and am now in a state of considerable trouble about Stephen who does not exert himself in a way to continue to hold his situation and I am quite unable to conceive what will become of him and his large family - I have also been in great anxiety about my will which has only just now been executed and I hope in a way that will be satisfactory to you all. I greatly regret that I have not more to leave you all - all goes on at Brenchley about as usual, your Sisters are going up now and then to Miss Saunders and calling upon the Kellys, the Moncktons etc etc but they have had no parties lately - The sale of the Little Farm at Yew Tree Green takes place on Thursday. I hope it will bring enough to relieve our immediate wants and prudence will I hope induce some more economical mode of living for we cannot long go on as we are now doing. I would send you your ring in this but we cannot get a letter registered here, but I will get John to have it registered at Tunbridge or the Wells when he goes. Today is poor Charlotte's Birthday but it is rather a dull one - We have fortunately got in the hay without rain which lessens expence as well as improves the hay - John has just return'd from Lincolnshire and I hope is getting more business about home. A new house of considerable size for Sir I Shaw and other things in prospect - with love to you from all here believe me to remain your very affectionate Father\n\nStephen Hooker",
        images: ["17.jpg"]
    },
    {
        title: "Family illness and news from The Firs",
        date: "1857, September 13",
        from: "Stephen Hooker b.1779 in Brenchley, Kent, England",
        to: "Mary Hooker b.1812 (aka. Cardy)",
